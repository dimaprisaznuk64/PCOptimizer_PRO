name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Ruff
        run: python -m ruff check .

      - name: Mypy
        run: python -m mypy app
        continue-on-error: true

      - name: Pytest
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: |
          python -m pytest tests -q --no-header 2>&1 | Tee-Object -FilePath pytest.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $tail = (Get-Content pytest.log -Tail 180) -join "`n"
            $tail = $tail -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            Write-Host "::error::Pytest failure tail%0A$tail"
            exit $code
          }
