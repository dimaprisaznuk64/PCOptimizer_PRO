name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Verify tag matches __version__
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $ver = python -c "from app import __version__; print(__version__)"
          Write-Host "Tag: $tag  Version: $ver"
          if ($tag -ne $ver) { throw "Tag $tag != app.__version__ $ver" }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Ruff
        run: python -m ruff check .

      - name: Pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q --no-header

      - name: Build exe
        shell: pwsh
        run: ./scripts/build_exe.ps1

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: ./scripts/build_installer.ps1

      - name: Portable zip
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          Compress-Archive -Path "dist\PCOptimizer_PRO\*" `
            -DestinationPath "dist\PCOptimizer_PRO_${v}_portable.zip" `
            -CompressionLevel Optimal

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/installer/PCOptimizer_PRO_Setup_*.exe
            dist/PCOptimizer_PRO_*_portable.zip
