name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Verify tag matches __version__
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(python -c "from app import __version__; print(__version__)")
          echo "Tag: $TAG  Version: $VER"
          if [ "$TAG" != "$VER" ]; then
            echo "ERROR: tag v$TAG does not match app.__version__ $VER"
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Ruff
        run: python -m ruff check .

      - name: Pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q --no-header

      - name: Build exe
        shell: pwsh
        run: python -m PyInstaller PCOptimizer_PRO.spec --noconfirm

      - name: Build portable zip
        shell: pwsh
        run: |
          $ver = python -c "from app import __version__; print(__version__)"
          Compress-Archive -Path "dist\PCOptimizer_PRO\*" `
            -DestinationPath "dist\PCOptimizer_PRO_${ver}_portable.zip" `
            -CompressionLevel Optimal

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = @(
            "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe",
            "D:\ПРАГРАМИ\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { Write-Error "ISCC.exe not found"; exit 1 }
          & $iscc "installer\PCOptimizer_PRO.iss"

      - name: Collect artifacts
        shell: pwsh
        run: |
          $ver = python -c "from app import __version__; print(__version__)"
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item "dist\installer\PCOptimizer_PRO_Setup_${ver}.exe" release-assets/
          Copy-Item "dist\PCOptimizer_PRO_${ver}_portable.zip" release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
