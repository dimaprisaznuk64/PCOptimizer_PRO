[project]
name = "pcoptimizer-pro"
dynamic = ["version"]
description = "Windows system monitor, cleaner, optimizer, and gaming tool"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "psutil>=6.1",
    "PySide6>=6.8",
    "nvidia-ml-py>=12.560",
    "WMI>=1.5.1; sys_platform == 'win32'",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.0", "pillow>=10.0", "ruff>=0.6", "mypy>=1.11"]

[project.urls]
Homepage = "https://github.com/dimaprisaznuk64/PCOptimizer_PRO"
Repository = "https://github.com/dimaprisaznuk64/PCOptimizer_PRO"
Issues = "https://github.com/dimaprisaznuk64/PCOptimizer_PRO/issues"

[project.gui-scripts]
pcoptimizer-pro = "app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "app.__version__" }

[tool.setuptools.packages.find]
include = ["app*"]

# ruff and pytest stay in ruff.toml / pytest.ini (they take precedence).

[tool.mypy]
python_version = "3.13"
platform = "win32"
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = true
check_untyped_defs = true
exclude = ["^tests/", "^scripts/", "^build/", "^dist/", "^app_run/"]
